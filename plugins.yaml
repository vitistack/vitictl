# plugins.yaml — curated index of viti-installable plugins.
#
# vitictl fetches this file at runtime (from raw.githubusercontent.com on
# the main branch) to resolve short plugin names to GitHub repos. Adding
# a third-party plugin is a single PR against this file; no vitictl
# release is required for the plugin to become installable.
#
# Per-entry fields:
#   name:         short name used on the command line (e.g. "gui" -> viti-gui)
#   repo:         <owner>/<repo> hosting the plugin's GitHub releases
#   description:  one-line summary shown by `viti plugin list --available`
#   aliases:      optional extra subcommand names, installed as links beside
#                 the binary (e.g. "kv" makes `viti kv` reach viti-kubevirt).
#
# Aliases live here rather than being chosen at install time because a clash
# is silent: viti only looks for a plugin when it does not recognise the
# subcommand, so an alias that collides with a built-in never fires and never
# says why. Declaring them centrally means a clash is caught in review, once,
# instead of on every machine that installed the plugin. `viti plugin install`
# refuses a colliding alias, and `viti plugin list` re-checks — a viti release
# can claim a name months after the alias was installed.
#
# Before adding one, check it against `viti --help`, including each command's
# aliases. Currently taken: c, cls, cpvip, eb, kc, kp, kvc, lb, m, mc, mp, nc,
# nn, pxc, vs, plus every full command name — and the plugin aliases claimed
# below: kv, t. Prefer aliases that shorten a genuinely long name; a
# two-letter alias for a three-letter plugin buys little and spends the
# namespace.
#
# Optional overrides (defaults cover the canonical "viti-<name> in its own
# repo" layout):
#   archiveAsset:        asset filename template; default
#                        "viti-{name}-{version}-{os}-{arch}.tar.gz"
#   archiveInnerPath:    path to the binary inside the archive; default
#                        "viti-{name}-{version}-{os}-{arch}/viti-{name}"
#   checksumsAsset:      SHA256SUMS filename template; default
#                        "viti-{name}-{version}-SHA256SUMS"
#   cosignIdentityRegex: OIDC identity regex for cosign verify-blob;
#                        default "^https://github.com/{repo}/.github/workflows/release.yml@refs/tags/"
#   private:             optional; omit it for a normal, listed plugin.
#                        true keeps the entry out of `viti plugin list
#                        --available` unless --all is passed. It controls
#                        advertising, not access — the plugin still installs
#                        for anyone who can read its repository. Use it for
#                        plugins in private repos that most readers of this
#                        file cannot install anyway.
#
# Teams can also keep their own index entirely: list extra index URLs under
# `pluginindexes` in ~/.vitistack/ctl.config.yaml and viti merges them with
# this one, with the configured index winning on a name clash.
#
# Template placeholders: {name} {repo} {version} {os} {arch}

plugins:
  - name: gui
    repo: vitistack/vitictl
    description: Terminal UI for viti
    aliases: [g]
    # viti-gui is built in the same release workflow as viti itself and
    # shares the combined checksums file.
    checksumsAsset: "viti-{version}-SHA256SUMS"

  - name: kubevirt
    repo: vitistack/vitictl-kubevirt
    description: List and control KubeVirt virtual machines
    aliases: [kv]

  - name: talos
    repo: vitistack/vitictl-talos
    description: Inspect, patch and upgrade Talos clusters across the fleet
    # A single letter is the expensive kind of alias — it is also the likeliest
    # name a future built-in claims — but it earns it here. Fleet work means
    # typing this over and over with several flags after it, and the
    # fleet-wide `patch` is driven interactively rather than from a script.
    #
    # If a viti release ever claims "t" for a built-in, the built-in wins and
    # this alias simply stops firing: `viti plugin install` refuses a
    # colliding alias and `viti plugin list` re-checks existing ones, so the
    # clash surfaces as a message rather than as a command that quietly does
    # the wrong thing. `viti talos` keeps working either way.
    aliases: [t]

  - name: nhn
    repo: vitistack/vitictl-nhn
    description: NHN-internal commands for viti
    # No alias: "n" is free today but reads as "network" next to the existing
    # nc and nn, and is the likeliest single letter a future built-in claims.
    # Three letters is already short enough to leave the namespace alone.
    # Private repository: hidden from the default listing because most
    # readers of this file cannot install it. Requires authentication —
    # see "Private plugin repositories" in the README.
    private: true
